name: darklet
description: "Darklet - a Flutter e-commerce app template with light/dark themes, English & Arabic, mock and Firebase backends."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0
  flutter_stripe: ^14.1.0
  http: ^1.6.0
  cloud_functions: ^6.5.0
  connectivity_plus: ^6.1.5
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/
    - assets/branding/splash_logo.png
  fonts:
    # Latin UI font (SIL OFL 1.1 - see assets/fonts/OFL-Poppins.txt)
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    # Arabic UI font (SIL OFL 1.1 - see assets/fonts/OFL-Tajawal.txt)
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 900

# Regenerate icons:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1D1D1D"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

# Regenerate splash:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1D1D1D"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#1D1D1D"
    image: assets/branding/splash_logo.png
  fullscreen: false
